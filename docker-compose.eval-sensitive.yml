services:
  search_service:
    environment:
      - SEARCH_USE_WEB=false
      - SEARCH_SCORE_THRESHOLD=0.3

  backend:
    environment:
      - STATUS_REFUTED_MIN_CONTRADICT_RATIO=0.2
      - STATUS_REFUTED_MIN_CONTRADICT_CLAIMS=1
      - STATUS_REFUTED_MIN_UNIQUE_DOMAINS=1
      - STATUS_CONFIRMED_MIN_ENTAIL_RATIO=0.5
      - STATUS_PARTIAL_MIN_ENTAIL_RATIO=0.2

  verifier_service:
    environment:
      - EVIDENCE_SIMILARITY_MIN_SCORE=0.3
      - EVIDENCE_RELEVANCE_MIN_SCORE=0.3
      - CLAIM_LABEL_MIN_CONFIDENCE=0.5
      - CONTRADICTION_MIN_MARGIN=0.03
      - STATUS_REFUTED_MIN_CONTRADICT_RATIO=0.2
      - STATUS_REFUTED_MIN_CONTRADICT_CLAIMS=1
      - STATUS_REFUTED_MIN_UNIQUE_DOMAINS=1
      - STATUS_CONFIRMED_MIN_ENTAIL_RATIO=0.5
      - STATUS_PARTIAL_MIN_ENTAIL_RATIO=0.0
