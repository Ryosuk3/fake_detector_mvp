# version устарел в новых версиях docker-compose

services:
  # PostgreSQL для хранения метаданных
  postgres:
    image: postgres:15-alpine
    container_name: fake_detector_postgres
    environment:
      POSTGRES_DB: fake_detector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant для векторного поиска
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fake_detector_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # Healthcheck убран, так как в образе нет wget/curl/python
    # Qdrant запускается быстро и работает стабильно

  # Redis для очередей задач
  redis:
    image: redis:7-alpine
    container_name: fake_detector_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO для хранения объектов
  minio:
    image: minio/minio:latest
    container_name: fake_detector_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake_detector_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fake_detector
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NLP_SERVICE_URL=http://nlp_service:8001
      - SEARCH_SERVICE_URL=http://search_service:8002
      - VERIFIER_SERVICE_URL=http://verifier_service:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # NLP Service (claim extraction, NER)
  nlp_service:
    build:
      context: ./services/nlp_service
      dockerfile: Dockerfile
    container_name: fake_detector_nlp
    ports:
      - "8001:8001"
    environment:
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - ./services/nlp_service:/app
      - nlp_models:/app/models
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Search Service (web search, parsing)
  search_service:
    build:
      context: ./services/search_service
      dockerfile: Dockerfile
    container_name: fake_detector_search
    ports:
      - "8002:8002"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - ./services/search_service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  # Verifier Service (NLI/Entailment)
  verifier_service:
    build:
      context: ./services/verifier_service
      dockerfile: Dockerfile
    container_name: fake_detector_verifier
    ports:
      - "8003:8003"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MODEL_CACHE_DIR=/app/models
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./services/verifier_service:/app
      - verifier_models:/app/models
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fake_detector_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  nlp_models:
  verifier_models:

